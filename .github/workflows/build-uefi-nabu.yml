name: build-uefi-nabu

on:
  workflow_dispatch:
    inputs:
      mode:
        description: DEBUG / RELEASE
        default: DEBUG

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup toolchain
        run: |
          sudo apt-get update -qq
          bash ./setup_env.sh -p apt

      - name: Build nabu UEFI
        run: |
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          chmod +x build_uefi.py build_active_devices.sh setup_env.sh || true

          # Resources/MuPatches came from a Windows commit (CRLF) while the
          # Mu_Basecore checkout is CRLF as well. git apply matches context
          # byte-for-byte, so normalise BOTH sides to LF.
          find Resources -name '*.patch' -exec sed -i 's/\r$//' {} \;
          grep -h '^+++ b/' Resources/MuPatches/*.patch | sed 's|^+++ b/||' | sort -u | while read -r f; do
            if [ -f "Mu_Basecore/$f" ]; then
              sed -i 's/\r$//' "Mu_Basecore/$f"
              echo "normalized Mu_Basecore/$f"
            fi
          done

          echo "--- patches still containing CR? ---"
          grep -rlc $'\r' Resources --include='*.patch' || echo "none"

          python3 ./build_uefi.py -d nabu -r "${{ inputs.mode || 'DEBUG' }}" -c 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "=== build exit: $rc ==="
          exit "$rc"

      - name: Collect
        if: always()
        run: |
          ls -la Mu-* 2>/dev/null || true
          ls -la BootShim/BootShim.* 2>/dev/null || true
          find Platforms -name 'SILICIUM_UEFI.fd*' -exec ls -la {} \; 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-nabu
          path: |
            Mu-nabu*
            BootShim/BootShim.bin
            BootShim/BootShim.elf
            Platforms/Xiaomi/nabuPkg/*_CLANGPDB/FV/SILICIUM_UEFI.fd*
            build.log
          if-no-files-found: warn
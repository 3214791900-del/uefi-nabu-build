name: build-uefi-nabu

on:
  workflow_dispatch:
    inputs:
      mode:
        description: DEBUG / RELEASE
        default: DEBUG

env:
  CI_BUILD: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup toolchain
        run: bash ./setup_env.sh -p apt

      - name: Build nabu UEFI
        run: |
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          chmod +x build_uefi.py build_active_devices.sh setup_env.sh || true
          find Resources -name '*.patch' -exec sed -i 's/\r$//' {} \;
          grep -rlc $'\r' Resources --include='*.patch' || echo "no CR left"

          PATCH="$GITHUB_WORKSPACE/Resources/MuPatches/AsmMacroLib.patch"
          TARGET="Mu_Basecore/MdePkg/Include/AArch64/AsmMacroLib.h"

          echo "--- Mu_Basecore HEAD ---"
          git -C Mu_Basecore rev-parse HEAD
          echo "--- Mu_Basecore status ---"
          git -C Mu_Basecore status --porcelain | head -20
          echo "--- target exists? ---"
          ls -la "$TARGET"
          echo "--- target lines 35..45 with cat -A ---"
          sed -n '35,45p' "$TARGET" | cat -A
          echo "--- patch lines 1..17 with cat -A ---"
          cat -A "$PATCH" | sed -n '1,17p'
          echo "--- git apply --check (verbose) ---"
          ( cd Mu_Basecore && git apply --check -v "$PATCH" 2>&1 | head -30 ) || true
          echo "--- end diagnosis ---"

          python3 ./build_uefi.py -d nabu -r "${{ inputs.mode || 'DEBUG' }}" -c 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "=== build exit: $rc ==="
          exit "$rc"

      - name: Collect
        if: always()
        run: |
          ls -la Mu-* 2>/dev/null || true
          ls -la BootShim/BootShim.* 2>/dev/null || true
          find Platforms -name 'SILICIUM_UEFI.fd*' -exec ls -la {} \; 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-nabu
          path: |
            Mu-nabu*
            BootShim/BootShim.bin
            BootShim/BootShim.elf
            Platforms/Xiaomi/nabuPkg/*_CLANGPDB/FV/SILICIUM_UEFI.fd*
            build.log
          if-no-files-found: warn